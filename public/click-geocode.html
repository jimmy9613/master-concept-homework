      <h1>2. 點擊查地址</h1>
      <p>在地圖上任意點一下，就會在該位置放上標記，並查詢、顯示這個位置的地址。</p>

      <h2>最近一次點擊</h2>
      <div id="status" class="status">尚未點擊地圖</div>

      <h2>使用到的技術</h2>
      <ul>
        <li><code>map.addListener('click')</code>：取得點擊位置的經緯度</li>
        <li><code>AdvancedMarkerElement</code>：畫出標記</li>
        <li><code>Geocoder</code>：反向地理編碼（座標 → 地址）</li>
        <li><code>InfoWindow</code>：在標記上方顯示地址</li>
      </ul>
    </aside>

    <div id="map"></div>
  </main>
